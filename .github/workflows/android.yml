name: android
on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "AmpliOwner-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: AmpliOwner-apk, path: android/AmpliOwner-*.apk }
      # A release gives a direct download link that opens on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ampli Owner test build ${{ github.run_number }}
          prerelease: true
          files: android/AmpliOwner-*.apk
