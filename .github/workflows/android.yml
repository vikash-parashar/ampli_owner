name: android
# Builds AmpliOwner-N.apk (release build type) and publishes it as release build-N.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      # Release build (not debuggable). Signed with the key from these secrets when they are set,
      # otherwise with the test key in the repo (see app/build.gradle.kts).
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
        env:
          OWNER_KEYSTORE_BASE64: ${{ secrets.OWNER_KEYSTORE_BASE64 }}
          OWNER_KEYSTORE_PASSWORD: ${{ secrets.OWNER_KEYSTORE_PASSWORD }}
          OWNER_KEY_ALIAS: ${{ secrets.OWNER_KEY_ALIAS }}
          OWNER_KEY_PASSWORD: ${{ secrets.OWNER_KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk "AmpliOwner-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: AmpliOwner-apk, path: android/AmpliOwner-*.apk }
      # A release gives a direct download link that opens on the phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ampli Owner test build ${{ github.run_number }}
          prerelease: true
          files: android/AmpliOwner-*.apk
